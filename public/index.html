<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="starfield"></canvas>

<div class="wrap">

  <!-- top-left: greeting -->
  <header class="corner top-left">
    <div class="greeting">
      <img id="pfp" class="pfp" src="icons/pfp.png" alt="profile picture">
      <div class="greeting-text">
        <h1 id="welcome">Welcome back, Patrick</h1>
        <p id="splash" class="splash">loading splash text...</p>
      </div>
    </div>
  </header>

  <!-- top-right: weather -->
  <section class="corner top-right">
    <div class="tag" id="wxLocation">weather</div>
    <div class="wx-temp" id="wxTemp">--°</div>
    <div class="wx-desc" id="wxDesc">fetching...</div>
    <div class="hairline"></div>
    <div class="wx-sub" id="wxSub"></div>
  </section>

  <!-- bottom-left: clock -->
  <section class="corner bottom-left">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">loading date</div>
  </section>

  <!-- bottom-right: stock ticker -->
  <section class="corner bottom-right" id="stockPanel">
    <div class="tag" id="stockSymbol">stock</div>
    <div class="stock-top">
      <div class="stock-price" id="stockPrice">--.--</div>
      <div class="stock-change" id="stockChange">
        <span class="stock-arrow" id="stockArrow">–</span>
        <span id="stockChangeText">--</span>
      </div>
    </div>
    <canvas id="stockSparkline" class="sparkline"></canvas>
  </section>

</div>

<script src="js/starfield.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
